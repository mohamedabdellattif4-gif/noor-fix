name: Build Noor APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
      - feature/github-actions

  pull_request:
    branches:
      - main
      - master
      - feature/github-actions

concurrency:
  group: build-noor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Noor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make Gradle executable
        run: chmod +x gradlew

      ####################################################
      # Verify Quran Database
      ####################################################

      - name: Verify Quran Database
        run: |
          test -s data/src/main/assets/database/noor.db

          python - <<'PY'
          import sqlite3

          db = sqlite3.connect("data/src/main/assets/database/noor.db")

          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert db.execute("PRAGMA user_version").fetchone()[0] == 4

          assert db.execute(
              "SELECT COUNT(*) FROM surahs"
          ).fetchone()[0] == 114

          assert db.execute(
              "SELECT COUNT(*) FROM ayahs"
          ).fetchone()[0] == 6236

          identity = db.execute(
              "SELECT identity_hash FROM room_master_table WHERE id=42"
          ).fetchone()[0]

          assert identity == "8b249f7a57ff80f6a0d55fa209a13515"

          sql = db.execute(
              "SELECT sql FROM sqlite_master WHERE name='ayahs_fts'"
          ).fetchone()[0]

          assert "content=`ayahs`" in sql

          print("Quran database verified successfully.")
          db.close()
          PY

      ####################################################
      # Tests
      ####################################################

      - name: Run Unit Tests
        run: ./gradlew --no-daemon test

      ####################################################
      # Lint
      ####################################################

      - name: Run Android Lint
        run: ./gradlew --no-daemon lint

      ####################################################
      # Build Debug APK
      ####################################################

      - name: Build Debug APK
        env:
          NOOR_VERSION_CODE: ${{ github.run_number }}
          NOOR_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      ####################################################
      # Verify APK
      ####################################################

      - name: Verify Database Inside APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -l "$APK" | grep -F "assets/database/noor.db"

          echo "Database exists inside APK."

      ####################################################
      # Build Release APK
      ####################################################

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      ####################################################
      # Build Release Bundle
      ####################################################

      - name: Build Release Bundle
        run: ./gradlew --no-daemon bundleRelease

      ####################################################
      # Upload Debug APK
      ####################################################

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      ####################################################
      # Upload Release APK
      ####################################################

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      ####################################################
      # Upload Release AAB
      ####################################################

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
