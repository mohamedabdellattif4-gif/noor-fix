name: Build Noor APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-noor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build verified Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Verify bundled Quran database and Room schema
        run: |
          test -s data/src/main/assets/database/noor.db
          python - <<'PY'
          import sqlite3
          path = "data/src/main/assets/database/noor.db"
          db = sqlite3.connect(path)
          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert db.execute("PRAGMA user_version").fetchone()[0] == 4
          assert db.execute("SELECT COUNT(*) FROM surahs").fetchone()[0] == 114
          assert db.execute("SELECT COUNT(*) FROM ayahs").fetchone()[0] == 6236
          assert db.execute("SELECT identity_hash FROM room_master_table WHERE id=42").fetchone()[0] == "8b249f7a57ff80f6a0d55fa209a13515"
          fts_sql = db.execute("SELECT sql FROM sqlite_master WHERE name='ayahs_fts'").fetchone()[0]
          assert "content=`ayahs`" in fts_sql, fts_sql
          print("Room-compatible Quran database verified")
          db.close()
          PY
          ls -lh data/src/main/assets/database/noor.db

      - name: Build Debug APK
        env:
          NOOR_VERSION_CODE: ${{ github.run_number }}
          NOOR_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify database is inside APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/database/noor.db"
          echo "Verified: APK contains assets/database/noor.db"

      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: Noor-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
