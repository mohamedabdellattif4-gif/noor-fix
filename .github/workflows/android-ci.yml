name: Android CI

on:
  push:
    branches: [main, master, feature/github-actions]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify repository, Quran corpus, architecture, and policies
        run: |
          python3 tools/verify_build_foundation.py --allow-missing-wrapper-jar
          python3 tools/verify_final.py
          python3 tools/verify_hardening.py
          python3 tools/verify_phase2_premium_home.py
          python3 tools/verify_phase3_premium_reader.py
          python3 tools/verify_phase4_premium_search.py
          python3 tools/verify_phase5_premium_bookmarks.py
          python3 tools/verify_phase6_premium_audio.py
          python3 tools/verify_phase7_premium_tafsir.py
          python3 tools/verify_phase8_premium_adhkar.py
          python3 tools/verify_flagship_review.py

  android-build:
    runs-on: ubuntu-latest
    needs: source-verification
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Verify Gradle Wrapper and toolchain pins
        run: |
          chmod +x gradlew
          python3 tools/verify_build_foundation.py --require-wrapper-jar
      - name: Unit tests, benchmark compilation, debug build, and strict lint
        run: |
          ./gradlew clean \
            :core:common:test \
            :core:media:test \
            :domain:test \
            :data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :data:assembleAndroidTest \
            :app:assembleDebug \
            :app:assembleBenchmark \
            :app:assembleNonMinifiedRelease \
            :baseline-profile:assembleBenchmark \
            :baseline-profile:assembleNonMinifiedRelease \
            :app:lintDebug \
            :app:lintRelease \
            --no-parallel \
            --max-workers=2 \
            --warning-mode=all \
            --stacktrace
      - name: Build unsigned release bundle
        run: ./gradlew :app:bundleRelease --no-parallel --max-workers=2 --stacktrace
      - name: Verify generated Android artifact
        run: python3 tools/verify_android_artifact.py app/build/outputs/bundle/release/app-release.aab
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: noor-ci-output
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/**
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/benchmark/*.apk
            app/build/outputs/bundle/release/*.aab
            baseline-profile/build/outputs/**
            **/build/test-results/**
            **/build/reports/tests/**

  instrumentation-tests:
    runs-on: ubuntu-latest
    needs: source-verification
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM for the Gradle-managed device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Run Room, parser, and Compose instrumentation tests
        run: |
          chmod +x gradlew
          ./gradlew :data:pixel6Api35DebugAndroidTest :app:pixel6Api35DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: noor-instrumentation-output
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            data/build/reports/androidTests/**
            data/build/outputs/androidTest-results/**
